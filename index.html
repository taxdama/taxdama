<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Générateur d'Images</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #0a0f24, #1a1f3c);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    #chatbox {
      width: 100%;
      max-width: 600px;
      background: #212b4a;
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px #0004;
    }
    .msg { margin: 0.5rem 0; }
    .user { color: #8ab4f8; }
    .bot { color: #81c784; }
    input, select, button {
      margin-top: 1rem;
      padding: 0.5rem;
      border-radius: 8px;
      border: none;
    }
    input, select {
      width: 100%;
      margin-bottom: 0.5rem;
    }
    button {
      background: #0af;
      color: white;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    img {
      margin-top: 1rem;
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Chatbot Créateur d'Images</h1>
  <div id="chatbox">
    <div id="messages"></div>
    <input type="text" id="prompt" placeholder="Décris l’image que tu veux..." />
    <select id="style">
      <option value="réaliste">Réaliste</option>
      <option value="dessin animé">Dessin animé</option>
      <option value="futuriste">Futuriste</option>
      <option value="peinture">Peinture</option>
    </select>
    <button onclick="generateImage()">Générer</button>
    <div id="result"></div>
  </div>

  <script>
    const messages = document.getElementById("messages");

    function showMessage(who, text) {
      const div = document.createElement("div");
      div.className = `msg ${who}`;
      div.textContent = `${who === "user" ? "Vous" : "Bot"} : ${text}`;
      messages.appendChild(div);
    }

    async function generateImage() {
      const prompt = document.getElementById("prompt").value;
      const style = document.getElementById("style").value;
      if (!prompt) return;

      const fullPrompt = `${prompt}, style ${style}`;
      showMessage("user", prompt);
      showMessage("bot", "Création de l’image...");

      const response = await fetch("https://api.openai.com/v1/images/generations", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer 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"
        },
        body: JSON.stringify({
          model: "dall-e-3",
          prompt: fullPrompt,
          n: 1,
          size: "1024x1024"
        })
      });

      const data = await response.json();
      const imgUrl = data.data[0].url;
      showMessage("bot", "Voici ton image !");
      document.getElementById("result").innerHTML = `<img src="${imgUrl}" alt="Image générée" />`;
    }
  </script>
</body>
</html
