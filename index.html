<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot Stylé</title>
  <style>
    body {
      background: linear-gradient(135deg, #222, #444);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    #chat {
      width: 100%;
      max-width: 500px;
      background: #333;
      border-radius: 10px;
      padding: 1rem;
    }
    .message {
      margin: 0.5rem 0;
    }
    input, button {
      padding: 0.5rem;
      border-radius: 5px;
      border: none;
    }
    input {
      width: 70%;
    }
    button {
      background: #0af;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Chatbot Stylé</h1>
  <div id="chat"></div>
  <input type="text" id="userInput" placeholder="Parle-moi..." />
  <button onclick="sendMessage()">Envoyer</button>

  <script>
    const chat = document.getElementById("chat");
    function sendMessage() {
      const input = document.getElementById("userInput");
      const msg = input.value;
      if (msg.trim() === "") return;
      chat.innerHTML += `<div class="message">Vous : ${msg}</div>`;
      chat.innerHTML += `<div class="message">Bot : Je suis cool et intelligent, mais je ne comprends pas encore tout !</div>`;
      input.value = "";
    }
  </script>
</body>
</html>
