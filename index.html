<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot Créateur d'Images</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    h1 {
      margin-top: 20px;
      font-size: 24px;
      text-align: center;
    }

    .chat-container {
      background: #ffffff10;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      height: 75vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin: 20px 0;
    }

    #chatbox {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin: 10px 0;
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 15px;
      line-height: 1.4;
    }

    .user {
      background: #1e88e5;
      align-self: flex-end;
      text-align: right;
    }

    .bot {
      background: #43a047;
      align-self: flex-start;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #444;
      padding: 10px;
      background-color: #222;
    }

    #input {
      flex-grow: 1;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
    }

    #send {
      margin-left: 10px;
      background: #00c853;
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    #send:hover {
      background: #00e676;
    }

    img {
      margin-top: 10px;
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>Créateur d'Images - Ton Bot Stylé</h1>
<div class="chat-container">
  <div id="chatbox"></div>
  <div id="input-area">
    <input type="text" id="input" placeholder="Décris l'image que tu veux..." />
    <button id="send">Envoyer</button>
  </div>
</div>

<script>
  const chatbox = document.getElementById('chatbox');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  async function sendMessage() {
    const userText = input.value.trim();
    if (!userText) return;

    addMessage(userText, 'user');
    input.value = '';

    // Envoie de la requête à l’API de génération d’images
    const response = await fetch('https://api.openai.com/v1/images/generations', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer VOTRE_CLE_API', // <-- Remplace ici par ta clé API OpenAI
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        prompt: userText,
        n: 1,
        size: "512x512"
      })
    });

    const data = await response.json();
    const imageUrl = data.data[0].url;

    addMessage(`<p>Voici ton image :</p><img src="${imageUrl}" />`, 'bot');
  }

  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.innerHTML = text;
    chatbox.appendChild(div);
    chatbox.scrollTop = chatbox.scrollHeight;
  }

  send.addEventListener('click', sendMessage);
  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
